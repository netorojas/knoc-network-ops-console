name: Bug report
description: Something is broken or looks wrong
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Thanks for reporting. Please **do not paste passwords, tokens or customer data**. Security issues go to a private advisory (see SECURITY.md)."
  - type: textarea
    id: what
    attributes:
      label: What happened and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open Map  2. Zoom into Brazil  3. ..."
  - type: input
    id: version
    attributes:
      label: Version and screen
      placeholder: "v4.0.0 · map · light theme · Chrome 130"
