<title>Orbiscale · Network Ops Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
:root{
  --ground:#F2F4F7;--surface:#FFFFFF;--surface-2:#E9EDF2;--surface-3:#DFE5EC;
  --ink:#0F1622;--ink-2:#465163;--ink-3:#6B7686;--line:#D5DCE5;--line-soft:#E6EBF0;
  --accent:#1B66C9;--accent-ink:#FFFFFF;--accent-soft:#E1ECFA;
  --ok:#1C7C45;--ok-bg:#E3F3EA;--warn:#9A5B00;--warn-bg:#FBF0DD;--crit:#BD2B2B;--crit-bg:#FBE7E6;--unk:#6F7A89;--unk-bg:#ECEFF3;
  --canvas:#0E141D;--canvas-dot:#1E2835;--canvas-ink:#DCE4EE;--canvas-ink2:#8795A8;--canvas-node:#18212D;--canvas-line:#3A4A5E;
  --sea:#E4EAF1;--land:#D2DAE3;--land-k:#B9CBE3;--land-line:#FFFFFF;
  --display:'Barlow Semi Condensed','Arial Narrow',Arial,sans-serif;
  --body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --mono:'JetBrains Mono',Consolas,'SF Mono',monospace;
  --r:8px;--shadow:0 1px 2px rgba(15,22,34,.06),0 1px 1px rgba(15,22,34,.04);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --ground:#0C1118;--surface:#141B25;--surface-2:#1B2430;--surface-3:#243040;
  --ink:#E4EBF3;--ink-2:#A7B3C2;--ink-3:#8290A2;--line:#27323F;--line-soft:#1E2833;
  --accent:#5AA6FF;--accent-ink:#0C1118;--accent-soft:#16304F;
  --ok:#5CCB8A;--ok-bg:#143022;--warn:#E8AE52;--warn-bg:#35280F;--crit:#F18A84;--crit-bg:#3A1A19;--unk:#8E9AAA;--unk-bg:#1F2833;
  --canvas:#0A0F16;--canvas-dot:#18212C;--canvas-node:#141C27;
  --sea:#0F1620;--land:#1E2835;--land-k:#23405F;--land-line:#0C1118;
  --shadow:0 1px 2px rgba(0,0,0,.45);}}
:root[data-theme="dark"]{color-scheme:dark;
  --ground:#0C1118;--surface:#141B25;--surface-2:#1B2430;--surface-3:#243040;
  --ink:#E4EBF3;--ink-2:#A7B3C2;--ink-3:#8290A2;--line:#27323F;--line-soft:#1E2833;
  --accent:#5AA6FF;--accent-ink:#0C1118;--accent-soft:#16304F;
  --ok:#5CCB8A;--ok-bg:#143022;--warn:#E8AE52;--warn-bg:#35280F;--crit:#F18A84;--crit-bg:#3A1A19;--unk:#8E9AAA;--unk-bg:#1F2833;
  --canvas:#0A0F16;--canvas-dot:#18212C;--canvas-node:#141C27;
  --sea:#0F1620;--land:#1E2835;--land-k:#23405F;--land-line:#0C1118;
  --shadow:0 1px 2px rgba(0,0,0,.45);}
*{box-sizing:border-box}
html,body{overflow-x:hidden}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:14.5px;line-height:1.5;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
code,.mono{font-family:var(--mono);font-size:12.5px}
h1,h2,h3,h4{font-family:var(--display);font-weight:600;letter-spacing:.005em;text-wrap:balance;margin:0}
.hide{display:none!important}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
aside.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);padding:14px 10px 20px}
.brand{display:flex;align-items:center;gap:9px;padding:2px 8px 14px}
.brand .logo{width:30px;height:30px;border-radius:7px;background:var(--canvas);display:grid;place-items:center;flex:0 0 auto}
.brand b{font-family:var(--display);font-size:19px;font-weight:700;letter-spacing:.04em;display:block;line-height:1}
.brand small{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.navg{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);padding:12px 10px 4px}
nav.main button{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:0;background:transparent;color:var(--ink-2);font-size:13.5px;font-weight:500;padding:7px 10px;border-radius:6px;cursor:pointer}
nav.main button svg{width:16px;height:16px;flex:0 0 auto;stroke:currentColor;fill:none;stroke-width:1.7}
nav.main button:hover{background:var(--surface-2);color:var(--ink)}
nav.main button[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
nav.main .cnt{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
nav.main .cnt.bad{color:var(--crit);font-weight:600}
.sidefoot{margin-top:18px;padding:10px;border-top:1px solid var(--line-soft);font-size:11.5px;color:var(--ink-3)}

main.content{min-width:0;padding-inline:24px;padding-block:0 60px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--ground);display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 0;border-bottom:1px solid var(--line)}
.gsearch{position:relative;flex:1 1 300px;max-width:560px}
.gsearch input{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:7px;padding:8px 12px 8px 32px;font-size:13.5px}
.gsearch input:focus{outline:0;border-color:var(--accent)}
.gsearch .ic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink-3);font-size:14px}
.gsearch kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:10px;color:var(--ink-3);border:1px solid var(--line);border-radius:4px;padding:1px 5px}
.results{position:absolute;top:calc(100% + 5px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 10px 30px rgba(0,0,0,.16);max-height:420px;overflow-y:auto;z-index:50;padding:5px}
.results button{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:3px 10px;width:100%;text-align:left;border:0;background:transparent;padding:7px 9px;border-radius:6px;cursor:pointer;align-items:center}
.results button:hover,.results button.on{background:var(--surface-2)}
.results .rt{font-weight:600;font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.results .rs{grid-column:2;font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.results .rk{font-family:var(--mono);font-size:10px;color:var(--ink-3);text-transform:uppercase}
.results .none{padding:14px;color:var(--ink-3);font-size:13px}
.tbar{display:flex;gap:6px;align-items:center;margin-left:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:transparent;font-family:var(--mono);font-size:10.5px;font-weight:600;padding:5px 8px;color:var(--ink-2);cursor:pointer}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.who{display:flex;align-items:center;gap:6px;font-size:12.5px;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:3px 10px 3px 3px;max-width:190px}
.who img{width:22px;height:22px;border-radius:50%}
.who b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mnav{display:none}

/* ---------- view ---------- */
.vhead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin:22px 0 14px}
.vhead h1{font-size:28px;line-height:1.1}
.vhead p{margin:4px 0 0;color:var(--ink-2);max-width:78ch;font-size:13.5px}
.vhead .act{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3)}
section.blk{margin-top:22px}
section.blk>h2{font-size:18px;margin-bottom:8px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
section.blk>h2 small{font-family:var(--mono);font-size:11px;color:var(--ink-3);font-weight:400}
.note{font-size:12.5px;color:var(--ink-3);max-width:84ch;margin:0 0 10px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:14px 16px}
.grid{display:grid;gap:10px}
.g-kpi{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.g-card{grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.g-2{grid-template-columns:repeat(auto-fit,minmax(min(100%,380px),1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;box-shadow:var(--shadow);text-align:left;cursor:pointer}
.kpi:hover{border-color:var(--accent)}
.kpi .n{font-family:var(--display);font-weight:700;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:12.5px;font-weight:600;margin-top:4px}
.kpi .x{font-size:11.5px;color:var(--ink-3);margin-top:2px}
.kpi.ok .n{color:var(--ok)}.kpi.crit .n{color:var(--crit)}.kpi.warn .n{color:var(--warn)}.kpi.acc .n{color:var(--accent)}

.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:6px;padding:6px 11px;font-size:12.5px;font-weight:600;cursor:pointer;color:var(--ink);text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.07);color:var(--accent-ink)}
.btn.danger{color:var(--crit)}
.btn.sm{padding:3px 8px;font-size:11.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10.5px;font-weight:600;padding:2px 8px;border-radius:10px;white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:currentColor}
.st-up{background:var(--ok-bg);color:var(--ok)}.st-down{background:var(--crit-bg);color:var(--crit)}.st-deg{background:var(--warn-bg);color:var(--warn)}.st-unk{background:var(--unk-bg);color:var(--unk)}
.tag{font-family:var(--mono);font-size:10px;padding:1px 6px;border-radius:4px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.conf{font-family:var(--mono);font-size:9.5px;font-weight:600;padding:1px 5px;border-radius:3px;letter-spacing:.04em}
.conf.F{background:var(--ok-bg);color:var(--ok)}.conf.P{background:var(--warn-bg);color:var(--warn)}.conf.H{background:var(--crit-bg);color:var(--crit)}

/* ---------- tables ---------- */
.tscroll{overflow-x:auto}
table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th,table.t td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
table.t th{font-family:var(--mono);font-size:10px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:600;background:var(--surface);position:sticky;top:0;cursor:pointer;white-space:nowrap}
table.t tbody tr{cursor:pointer}
table.t tbody tr:hover{background:var(--surface-2)}
table.t td.ip{font-family:var(--mono);font-size:12px;white-space:nowrap}
table.t td.nm{font-weight:600;white-space:nowrap}
.muted{color:var(--ink-3)}
.fill{color:var(--warn);font-style:italic;font-size:12px}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.filters input[type=search],.filters select{background:var(--ground);border:1px solid var(--line);border-radius:6px;padding:6px 9px;font-size:13px}
.filters input[type=search]{flex:1 1 200px;min-width:0}

/* ---------- code ---------- */
.cmd{display:flex;align-items:stretch;gap:0;background:var(--canvas);border-radius:6px;overflow:hidden;margin:5px 0}
.cmd pre{margin:0;flex:1;min-width:0;overflow-x:auto;padding:8px 11px;color:var(--canvas-ink);font-family:var(--mono);font-size:12px;line-height:1.5;white-space:pre}
.cmd button{border:0;border-left:1px solid var(--canvas-line);background:transparent;color:var(--canvas-ink2);font-family:var(--mono);font-size:10.5px;padding:0 10px;cursor:pointer}
.cmd button:hover{color:#fff;background:#223045}
.cmd .cl{font-family:var(--mono);font-size:10px;color:var(--canvas-ink2);padding:8px 0 0 11px;display:block}

/* ---------- map ---------- */
.mapwrap{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr);gap:12px}
.map{background:var(--sea);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;position:relative}
.map svg{display:block;width:100%;height:auto;max-height:78vh}
.map path.c{fill:var(--land);stroke:var(--land-line);stroke-width:.8}
.map path.c.k{fill:var(--land-k);cursor:pointer}
.map path.c.k:hover,.map path.c.k.sel{fill:var(--accent);opacity:.55}
.map .mk{cursor:pointer}
.map .mk circle.halo{fill:none;stroke-width:2}
.map .mk text{font-family:var(--mono);font-size:13px;font-weight:600;fill:var(--ink);paint-order:stroke;stroke:var(--sea);stroke-width:4px}
.map .wan{fill:none;stroke:var(--accent);stroke-width:1.6;stroke-dasharray:5 5;opacity:.75}
.map .legend{position:absolute;left:10px;bottom:10px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font-size:11.5px;display:flex;gap:10px;flex-wrap:wrap}
.map .legend span{display:inline-flex;gap:5px;align-items:center}
.map .legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
@keyframes pulse{0%{r:14}100%{r:26;opacity:0}}
.map circle.pulse{fill:none;stroke:var(--crit);stroke-width:2;animation:pulse 1.6s ease-out infinite}
.side-list .it{display:flex;gap:9px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line-soft);cursor:pointer}
.side-list .it:hover{background:var(--surface-2)}
.side-list .it b{font-size:13px}
.side-list .it .sub{font-size:11.5px;color:var(--ink-3);font-family:var(--mono)}
.side-list .it .pill{margin-left:auto}
.ccard{display:flex;flex-direction:column;gap:3px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);cursor:pointer;text-align:left}
.ccard:hover{border-color:var(--accent)}
.ccard .cc{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
.ccard b{font-family:var(--display);font-size:17px}
.bar3{display:flex;height:6px;border-radius:3px;overflow:hidden;background:var(--unk-bg);margin-top:4px}
.bar3 i{display:block;height:100%}

/* ---------- topology ---------- */
.topo{position:relative;background:var(--canvas);border-radius:var(--r);overflow:hidden;border:1px solid #000;height:min(74vh,760px);min-height:420px;touch-action:none}
.topo svg{width:100%;height:100%;display:block;cursor:grab}
.topo svg.panning{cursor:grabbing}
.topo .node{cursor:pointer}
.topo .node rect.box{fill:var(--canvas-node);stroke:var(--canvas-line);stroke-width:1.2}
.topo .node.sel rect.box{stroke:#5AA6FF;stroke-width:2}
.topo .node.pick rect.box{stroke:#E8AE52;stroke-width:2;stroke-dasharray:4 3}
.topo .node text.nm{font-family:var(--mono);font-size:11px;fill:var(--canvas-ink);font-weight:600}
.topo .node text.ip{font-family:var(--mono);font-size:10px;fill:var(--canvas-ink2)}
.topo .node .ico{stroke:#9FB4CC;fill:none;stroke-width:1.5}
.topo line.lk{stroke:var(--canvas-line);stroke-width:1.6}
.topo line.lk.wan{stroke:#5AA6FF;stroke-dasharray:6 4}
.topo line.lk.vpn{stroke:#B48CFF;stroke-dasharray:3 4}
.topo line.lk.ha{stroke:#E8AE52;stroke-width:2.4}
.topo line.lk.sip{stroke:#5CCB8A;stroke-dasharray:2 3}
.topo line.lk.hit{stroke:transparent;stroke-width:12;cursor:pointer}
.topo text.lkl{font-family:var(--mono);font-size:9.5px;fill:var(--canvas-ink2)}
.topo rect.zone{fill:rgba(90,166,255,.04);stroke:#243246;stroke-dasharray:4 4;rx:10}
.topo text.zl{font-family:var(--display);font-size:15px;font-weight:600;fill:#6D7F96;letter-spacing:.06em;text-transform:uppercase}
.toolbar{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.toolbar>*{pointer-events:auto}
.toolbar .tb{background:#141C27;border:1px solid #2B3848;color:#C9D5E3;border-radius:6px;padding:5px 9px;font-size:12px;font-weight:600;cursor:pointer}
.toolbar .tb[aria-pressed="true"]{background:#1B66C9;border-color:#5AA6FF;color:#fff}
.toolbar select.tb{font-weight:500}
.toolbar .hint{background:#221A09;border:1px solid #6B4E18;color:#E8AE52;border-radius:6px;padding:5px 9px;font-size:12px}
.tlegend{position:absolute;bottom:10px;left:10px;display:flex;gap:12px;flex-wrap:wrap;font-family:var(--mono);font-size:10.5px;color:#8795A8;background:rgba(10,15,22,.8);padding:5px 9px;border-radius:6px}
.tlegend i{display:inline-block;width:16px;height:0;border-top:2px solid;vertical-align:3px;margin-right:4px}

/* ---------- drawer / modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(5,10,16,.45);z-index:80}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(470px,100%);background:var(--surface);border-left:1px solid var(--line);z-index:90;overflow-y:auto;box-shadow:-10px 0 30px rgba(0,0,0,.2);padding:0 0 30px}
.drawer .dh{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:14px 18px;display:flex;gap:10px;align-items:flex-start;z-index:2}
.drawer .dh h2{font-size:22px;word-break:break-all}
.drawer .dh .x{margin-left:auto;border:0;background:transparent;font-size:20px;cursor:pointer;color:var(--ink-3)}
.drawer .db{padding:14px 18px}
dl.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:6px 12px;margin:0;font-size:13px}
dl.kv dt{color:var(--ink-3);font-size:12px}
dl.kv dd{margin:0;overflow-wrap:anywhere}
.drawer h3{font-size:15px;margin:18px 0 6px}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.modal{position:fixed;inset:0;z-index:95;display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto}
.modal .box{background:var(--surface);border:1px solid var(--line);border-radius:10px;width:min(640px,100%);box-shadow:0 20px 60px rgba(0,0,0,.35)}
.modal .box header{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.modal .box header h2{font-size:20px}
.modal .box .body{padding:14px 18px;display:grid;gap:10px;grid-template-columns:repeat(2,minmax(0,1fr))}
.modal .box footer{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld.full{grid-column:1/-1}
.fld label{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3)}
.fld input,.fld select,.fld textarea{background:var(--ground);border:1px solid var(--line);border-radius:6px;padding:7px 9px;font-size:13.5px;width:100%}
.fld textarea{min-height:70px;resize:vertical}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:0;border-color:var(--accent)}
.warnbox{grid-column:1/-1;background:var(--crit-bg);color:var(--crit);border-radius:6px;padding:8px 10px;font-size:12.5px}
.infobox{background:var(--accent-soft);color:var(--ink);border-radius:var(--r);padding:10px 14px;font-size:13px;border:1px solid var(--line)}
.infobox b{color:var(--accent)}
.alertbox{background:var(--warn-bg);color:var(--ink);border-radius:var(--r);padding:10px 14px;font-size:13px;border:1px solid var(--line)}
.alertbox b{color:var(--warn)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:8px 16px;border-radius:18px;font-size:13px;z-index:120;box-shadow:0 6px 20px rgba(0,0,0,.25)}

/* ---------- links ---------- */
.lgrid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(230px,1fr))}
.lnk{display:flex;flex-direction:column;gap:2px;padding:10px 12px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);text-decoration:none;color:var(--ink);position:relative;min-height:62px}
.lnk:hover{border-color:var(--accent)}
.lnk b{font-size:13.5px;padding-right:44px}
.lnk span{font-size:11.5px;color:var(--ink-3)}
.lnk .conf{position:absolute;top:10px;right:10px}
.lnk.custom b::after{content:" · equipe";font-weight:400;color:var(--ink-3);font-size:11px}

/* ---------- playbooks ---------- */
.layers{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.layers button{border:1px solid var(--line);background:var(--surface);border-radius:16px;padding:5px 12px;font-size:12.5px;cursor:pointer;color:var(--ink-2)}
.layers button b{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-right:4px}
.layers button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.layers button[aria-pressed="true"] b{color:var(--accent-ink)}
.pb h3{font-size:17px;margin-bottom:4px}
.pb ul{margin:6px 0 10px;padding-left:18px;font-size:13.5px;color:var(--ink-2)}
.pb li{margin-bottom:3px}
.gen{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));margin-bottom:12px}

/* ---------- flow ---------- */
.flow{display:flex;align-items:stretch;gap:0;overflow-x:auto;padding:6px 2px 10px}
.flow .fs{flex:0 0 auto;min-width:150px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;font-size:12.5px}
.flow .fs b{display:block;font-family:var(--display);font-size:15px}
.flow .fs span{color:var(--ink-3);font-family:var(--mono);font-size:11px}
.flow .ar{flex:0 0 auto;display:flex;flex-direction:column;justify-content:center;align-items:center;padding:0 6px;font-family:var(--mono);font-size:10px;color:var(--accent);min-width:78px;text-align:center}
.flow .ar::after{content:"";display:block;width:100%;border-top:2px solid var(--accent);margin-top:4px}

/* ---------- chat ---------- */
.chat{display:flex;flex-direction:column;height:min(70vh,680px);min-height:380px}
.msgs{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:9px 13px;border-radius:10px;font-size:13.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:3px}
.msg.a{align-self:flex-start;background:var(--surface-2);border-bottom-left-radius:3px}
.msg.a code{background:var(--surface-3);padding:0 4px;border-radius:3px}
.msg.tool{align-self:flex-start;font-family:var(--mono);font-size:11px;color:var(--ink-3);background:transparent;padding:0 4px}
.composer{display:flex;gap:8px;padding:10px;border-top:1px solid var(--line)}
.composer textarea{flex:1;resize:none;background:var(--ground);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-height:44px;max-height:140px}
.sugg{display:flex;gap:6px;flex-wrap:wrap;padding:0 16px 10px}
.sugg button{border:1px dashed var(--line);background:transparent;border-radius:14px;padding:4px 10px;font-size:12px;color:var(--ink-2);cursor:pointer}
.sugg button:hover{border-color:var(--accent);color:var(--accent)}

/* ---------- docs ---------- */
.doc{max-width:82ch}
.doc h3{font-size:18px;margin:22px 0 6px}
.doc h3:first-child{margin-top:0}
.doc p,.doc li{font-size:13.5px;color:var(--ink-2)}
.doc ol,.doc ul{padding-left:20px}
.doc li{margin-bottom:4px}
.doc code{background:var(--surface-2);padding:1px 5px;border-radius:4px}
.tabsub{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px}
.tabsub button{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:5px 12px;font-size:12.5px;cursor:pointer;color:var(--ink-2)}
.tabsub button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--ground);font-weight:600}
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:18px;text-align:center;color:var(--ink-3);font-size:13px}
.drop.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.empty{padding:26px 16px;text-align:center;color:var(--ink-3);font-size:13px}
.matrix td.s{text-align:center}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  aside.side{display:none}
  .mnav{display:flex;gap:4px;overflow-x:auto;padding:8px 0 2px;width:100%;scrollbar-width:thin}
  .mnav button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:5px 11px;font-size:12.5px;cursor:pointer;color:var(--ink-2)}
  .mnav button[aria-current="page"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  main.content{padding-inline:16px}
  .mapwrap{grid-template-columns:minmax(0,1fr)}
  .modal .box .body{grid-template-columns:minmax(0,1fr)}
  .vhead h1{font-size:24px}
  .gsearch kbd{display:none}
  header.top{position:relative;top:0}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

no portal no navegador do app do Claude (Cmd/Ctrl+Shift+B). A sessão fica no perfil do navegador; o Claude lê telas de configuração e status e grava aqui só dado sem segredo (modelo, firmware, IP, validade de certificado). Senha nunca é digitada pelo Claude, nunca vai para chat, arquivo ou este portal.": {"es": "Para discovery. Usted entra al portal en el navegador de la app de Claude (Cmd/Ctrl+Shift+B). La sesión queda en el perfil del navegador; Claude lee pantallas de configuración y estado y graba aquí solo datos sin secretos (modelo, firmware, IP, vigencia del certificado). La contraseña nunca es escrita por Claude, nunca va al chat, a un archivo ni a este portal.", "en": "For discovery. You log into the portal in Claude's app browser (Cmd/Ctrl+Shift+B). The session stays in the browser profile; Claude reads configuration and status screens and only records non-secret data here (model, firmware, IP, certificate validity). The password is never typed by Claude, and never goes to chat, a file, or this portal."}, "2 · Conector OAuth no claude.ai": {"es": "2 · Conector OAuth en claude.ai", "en": "2 · OAuth connector on claude.ai"}, "Para M365, Teams, SharePoint e ServiceDesk Plus. Você autoriza uma vez em Configurações → Conectores com a conta nominal; o token fica no claude.ai, com o escopo que o admin liberou. Nada de senha em página. SDP já está ligado.": {"es": "Para M365, Teams, SharePoint y ServiceDesk Plus. Usted autoriza una vez en Configuración → Conectores con la cuenta nominal; el token queda en claude.ai, con el alcance que el admin liberó. Nada de contraseñas en la página. SDP ya está conectado.", "en": "For M365, Teams, SharePoint and ServiceDesk Plus. You authorize once in Settings → Connectors with the nominal account; the token stays in claude.ai, with the scope the admin granted. No password on the page. SDP is already connected."}, "3 · Conta de serviço read-only + Azure Key Vault": {"es": "3 · Cuenta de servicio read-only + Azure Key Vault", "en": "3 · Read-only service account + Azure Key Vault"}, "Para coleta automática (FortiGate REST API, vCenter, AudioCodes, Zabbix, iDRAC/Redfish). Crie conta/token só leitura, com trusted host/IP restrito, guarde no Key Vault e dê acesso via identidade gerenciada ao runbook do Azure Automation ou ao jump host. O coletor gera JSON (igual ao Sweep) e a tarefa Orbiscale Daily importa.": {"es": "Para recolección automática (FortiGate REST API, vCenter, AudioCodes, Zabbix, iDRAC/Redfish). Cree cuenta/token solo lectura, con trusted host/IP restringido, guárdelo en el Key Vault y dé acceso vía identidad administrada al runbook de Azure Automation o al jump host. El colector genera JSON (igual al Sweep) y la tarea Orbiscale Daily lo importa.", "en": "For automatic collection (FortiGate REST API, vCenter, AudioCodes, Zabbix, iDRAC/Redfish). Create a read-only account/token, with a restricted trusted host/IP, store it in Key Vault and grant access via managed identity to the Azure Automation runbook or the jump host. The collector generates JSON (like Sweep) and the Orbiscale Daily task imports it."}, "Nunca": {"es": "Nunca", "en": "Never"}, "Senha em planilha, KeePass exportado em XML, e-mail, Teams, notas deste portal, parâmetro de script ou variável de ambiente sem cofre. Achou uma? Registre onde apareceu, troque a senha e não reproduza o valor.": {"es": "Contraseña en hoja de cálculo, KeePass exportado en XML, correo, Teams, notas de este portal, parámetro de script o variable de entorno sin bóveda. ¿Encontró una? Registre dónde apareció, cambie la contraseña y no reproduzca el valor.", "en": "Password in a spreadsheet, KeePass exported to XML, email, Teams, this portal's notes, a script parameter, or an environment variable without a vault. Found one? Log where it appeared, rotate the password, and don't reproduce the value."}, "Exemplo: token read-only do FortiGate no Key Vault": {"es": "Ejemplo: token read-only del FortiGate en el Key Vault", "en": "Example: FortiGate read-only token in Key Vault"}, "Confirme a sintaxe na doc da sua versão do FortiOS e rode primeiro em janela. Rollback: remover o api-user e o segredo.": {"es": "Confirme la sintaxis en la doc de su versión de FortiOS y ejecútelo primero en ventana de cambio. Rollback: eliminar el api-user y el secreto.", "en": "Confirm the syntax in the docs for your FortiOS version and run it first in a change window. Rollback: remove the api-user and the secret."}, "FortiGate · perfil só leitura + usuário REST API com trusted host": {"es": "FortiGate · perfil solo lectura + usuario REST API con trusted host", "en": "FortiGate · read-only profile + REST API user with trusted host"}, "Azure · guardar o token no Key Vault (o valor entra pelo prompt, não pelo histórico)": {"es": "Azure · guardar el token en Key Vault (el valor entra por el prompt, no por el historial)", "en": "Azure · store the token in Key Vault (value entered at the prompt, not in history)"}, "Rollback do segredo": {"es": "Rollback del secreto", "en": "Secret rollback"}, "O Orbiscale tem duas metades: o console desktop (roda dentro da rede e testa de verdade) e este portal (centraliza, mostra e compartilha).": {"es": "El Orbiscale tiene dos mitades: la consola desktop (corre dentro de la red y prueba de verdad) y este portal (centraliza, muestra y comparte).", "en": "Orbiscale has two halves: the desktop console (runs inside the network and actually tests) and this portal (centralizes, shows and shares)."}, "Orbiscale desktop — abas": {"es": "Orbiscale desktop — pestañas", "en": "Orbiscale desktop — tabs"}, "Uptime, SO, IPs, portas escutando com processo, serviços observados e discos. Local ou remoto via WinRM.": {"es": "Uptime, SO, IPs, puertos en escucha con proceso, servicios observados y discos. Local o remoto vía WinRM.", "en": "Uptime, OS, IPs, listening ports with process, observed services and disks. Local or remote via WinRM."}, "Quem chega nas portas (22, 3389…) com histórico NOVA / MUDOU / FECHOU e exportação com SHA256.": {"es": "Quién llega a los puertos (22, 3389…) con historial NUEVA / CAMBIÓ / CERRÓ y exportación con SHA256.", "en": "Who's hitting the ports (22, 3389…) with a NEW / CHANGED / CLOSED history and SHA256 export."}, "Captura & Evidência": {"es": "Captura y Evidencia", "en": "Capture & Evidence"}, "ALTERA ESTADO": {"es": "MODIFICA ESTADO", "en": "CHANGES STATE"}, "pktmon filtrado com prévia de comandos, confirmação, rollback e manifesto SHA256. Única aba que altera estado.": {"es": "pktmon filtrado con vista previa de comandos, confirmación, rollback y manifiesto SHA256. Única pestaña que altera el estado.", "en": "Filtered pktmon with a command preview, confirmation, rollback and SHA256 manifest. Only tab that changes state."}, "Sweep (novo)": {"es": "Sweep (nuevo)", "en": "Sweep (new)"}, "Testa todos os ativos do inventário (ICMP ou TCP) e gera o JSON que acende o mapa e a topologia deste portal.": {"es": "Prueba todos los activos del inventario (ICMP o TCP) y genera el JSON que enciende el mapa y la topología de este portal.", "en": "Tests every asset in the inventory (ICMP or TCP) and generates the JSON that lights up this portal's map and topology."}, "Instalar e abrir o console": {"es": "Instalar y abrir la consola", "en": "Install and open the console"}, "Copiar a pasta Orbiscale para": {"es": "Copiar la carpeta Orbiscale a", "en": "Copy the Orbiscale folder to"}, ". Sem instalador, sem registro, sem serviço. A aba Captura exige PowerShell como Administrador.": {"es": ". Sin instalador, sin registro, sin servicio. La pestaña Captura requiere PowerShell como Administrador.", "en": ". No installer, no registry entry, no service. The Capture tab requires PowerShell as Administrator."}, "1 · Validar o ambiente sem abrir a janela": {"es": "1 · Validar el entorno sin abrir la ventana", "en": "1 · Validate the environment without opening the window"}, "2 · Abrir (PowerShell 7)": {"es": "2 · Abrir (PowerShell 7)", "en": "2 · Open (PowerShell 7)"}, "2b · Abrir direto numa aba": {"es": "2b · Abrir directo en una pestaña", "en": "2b · Open directly in a tab"}, "Testes antes de commit no it.infra": {"es": "Pruebas antes del commit en it.infra", "en": "Tests before committing to it.infra"}, "Orbiscale Sweep — como acender o mapa": {"es": "Orbiscale Sweep — cómo encender el mapa", "en": "Orbiscale Sweep — how to light up the map"}, "Por que existe:": {"es": "Por qué existe:", "en": "Why it exists:"}, "este portal roda no claude.ai, fora da rede Contoso. O navegador não consegue pingar 192.168.x.x. O Sweep roda numa máquina de dentro da rede (seu notebook na VPN ou um jump host), testa cada ativo e gera um JSON que você importa aqui.": {"es": "este portal corre en claude.ai, fuera de la red de Contoso. El navegador no puede hacer ping a 192.168.x.x. El Sweep corre en una máquina dentro de la red (su notebook en la VPN o un jump host), prueba cada activo y genera un JSON que usted importa aquí.", "en": "this portal runs on claude.ai, outside the Contoso network. The browser can't ping 192.168.x.x. Sweep runs on a machine inside the network (your laptop on the VPN or a jump host), tests each asset and generates a JSON you import here."}, "Exportar alvos": {"es": "Exportar objetivos", "en": "Export targets"}, "— em Inventário ou Monitoria, botão “Exportar alvos p/ Sweep”. Gera": {"es": "— en Inventario o Monitoreo, botón “Exportar objetivos p/ Sweep”. Genera", "en": "— in Inventory or Monitoring, the “Export targets for Sweep” button. Generates"}, "só com id, nome, IP/FQDN e porta. Sem credencial.": {"es": "solo con id, nombre, IP/FQDN y puerto. Sin credenciales.", "en": "only with id, name, IP/FQDN and port. No credentials."}, "Rodar o Sweep": {"es": "Ejecutar el Sweep", "en": "Run the Sweep"}, "numa máquina da rede. READ-ONLY: ICMP echo ou abertura TCP, nada mais.": {"es": "en una máquina de la red. READ-ONLY: ICMP echo o apertura TCP, nada más.", "en": "on a machine in the network. READ-ONLY: ICMP echo or TCP open, nothing else."}, "Importar": {"es": "Importar", "en": "Import"}, "— Monitoria → soltar": {"es": "— Monitoreo → soltar", "en": "— Monitoring → drop"}, ". Mapa, topologia e inventário mudam de cor para todos da equipe.": {"es": ". Mapa, topología e inventario cambian de color para todo el equipo.", "en": ". Map, topology and inventory change color for the whole team."}, "Rodar uma vez": {"es": "Ejecutar una vez", "en": "Run once"}, "Rodar em loop a cada 5 min (deixa aberto durante um incidente)": {"es": "Ejecutar en loop cada 5 min (déjelo abierto durante un incidente)", "en": "Run in a loop every 5 min (leave it open during an incident)"}, "Ativo com porta preenchida é testado por TCP; sem porta, por ICMP. Latência acima de 300 ms entra como “degradado”. Resultado sai em": {"es": "Activo con puerto informado se prueba por TCP; sin puerto, por ICMP. Latencia por encima de 300 ms entra como “degradado”. El resultado sale en", "en": "An asset with a port filled in is tested via TCP; without a port, via ICMP. Latency above 300 ms counts as “degraded”. The result comes out in"}, "Onde versionar": {"es": "Dónde versionar", "en": "Where to version"}, "Estrutura no it.infra": {"es": "Estructura en it.infra", "en": "Structure in it.infra"}, "Pergunte sobre o inventário, o status e os playbooks deste portal. Ele consulta os dados antes de responder e não executa nada na rede.": {"es": "Pregunte sobre el inventario, el estado y los playbooks de este portal. Consulta los datos antes de responder y no ejecuta nada en la red.", "en": "Ask about this portal's inventory, status and playbooks. It checks the data before answering and doesn't run anything on the network."}, "Oi. Eu leio o inventário, o status do último Sweep e os playbooks deste portal. Pergunte algo como “o que está fora?” ou “como testo o SBC?”.": {"es": "Hola. Leo el inventario, el estado del último Sweep y los playbooks de este portal. Pregunte algo como “¿qué está caído?” o “¿cómo pruebo el SBC?”.", "en": "Hi. I read this portal's inventory, the latest Sweep status and its playbooks. Ask something like “what's down?” or “how do I test the SBC?”"}, "Assistente indisponível nesta visualização.": {"es": "Asistente no disponible en esta vista.", "en": "Assistant unavailable in this view."}, "O que está fora agora?": {"es": "¿Qué está caído ahora?", "en": "What's down right now?"}, "Quais ativos do Brasil estão sem IP?": {"es": "¿Qué activos de Brasil están sin IP?", "en": "Which Brazil assets have no IP?"}, "Como acesso o FW-BR-SP-01?": {"es": "¿Cómo accedo al FW-BR-SP-01?", "en": "How do I access FW-BR-SP-01?"}, "Passo a passo para SBC inativo no Teams": {"es": "Paso a paso para SBC inactivo en Teams", "en": "Step by step for SBC inactive in Teams"}, "Onde está o Sentinel?": {"es": "¿Dónde está el Sentinel?", "en": "Where is Sentinel?"}, "Enviar": {"es": "Enviar", "en": "Send"}, "Cada pergunta usa a cota de Claude de quem pergunta. Na primeira vez o navegador pede permissão.": {"es": "Cada pregunta usa la cuota de Claude de quien pregunta. La primera vez el navegador pide permiso.", "en": "Each question uses the asker's Claude quota. The first time, the browser asks for permission."}, "Ex.: qual o IP do FW-BR-SP-01 e como acesso?": {"es": "Ej.: ¿cuál es la IP del FW-BR-SP-01 y cómo accedo?", "en": "E.g.: what's the IP of FW-BR-SP-01 and how do I access it?"}, "Documentação & tutoriais": {"es": "Documentación y tutoriales", "en": "Documentation & tutorials"}, "Como usar o portal, padrões de cadastro, regras de segurança e a biblioteca de tutoriais da equipe.": {"es": "Cómo usar el portal, estándares de registro, reglas de seguridad y la biblioteca de tutoriales del equipo.", "en": "How to use the portal, registration standards, security rules and the team's tutorial library."}, "Como usar": {"es": "Cómo usar", "en": "How to use"}, "Padrão de cadastro": {"es": "Estándar de registro", "en": "Registration standard"}, "Como o status funciona": {"es": "Cómo funciona el estado", "en": "How status works"}, "Em 1 minuto": {"es": "En 1 minuto", "en": "In 1 minute"}, "abre a busca global: ativo, IP, site, parceiro, link ou playbook.": {"es": "abre la búsqueda global: activo, IP, sitio, socio, enlace o playbook.", "en": "opens the global search: asset, IP, site, partner, link or playbook."}, "mostra onde a Contoso está e o que está fora. Clique num país para ver sites e ativos.": {"es": "muestra dónde está Contoso y qué está caído. Haga clic en un país para ver sitios y activos.", "en": "shows where Contoso is and what's down. Click a country to see sites and assets."}, "é a vista estilo EVE-NG. Filtre por país, arraste o fundo, role para zoom. Clique num ativo para ver acesso e comandos.": {"es": "es la vista estilo EVE-NG. Filtre por país, arrastre el fondo, desplácese para zoom. Haga clic en un activo para ver acceso y comandos.", "en": "is the EVE-NG style view. Filter by country, drag the background, scroll to zoom. Click an asset to see access and commands."}, "é a fonte: tudo que aparece no mapa e na topologia nasce aqui.": {"es": "es la fuente: todo lo que aparece en el mapa y en la topología nace aquí.", "en": "is the source: everything on the map and topology originates here."}, "tem o playbook por camada com comandos já preenchidos com o host que você está investigando.": {"es": "tiene el playbook por capa con comandos ya completados con el host que está investigando.", "en": "has the layer-by-layer playbook with commands pre-filled with the host you're investigating."}, "responde perguntas sobre o inventário (“qual o IP do firewall do Brasil?”, “o que está fora?”).": {"es": "responde preguntas sobre el inventario (“¿cuál es la IP del firewall de Brasil?”, “¿qué está caído?”).", "en": "answers questions about the inventory (“what's the IP of Brazil's firewall?”, “what's down?”)."}, "Quem pode editar": {"es": "Quién puede editar", "en": "Who can edit"}, "Quem tem acesso “pode interagir” ou “pode editar” ao artifact grava no inventário. Quem só visualiza vê tudo em leitura. Toda gravação registra quem e quando.": {"es": "Quien tiene acceso “puede interactuar” o “puede editar” al artifact graba en el inventario. Quien solo visualiza ve todo en lectura. Toda grabación registra quién y cuándo.", "en": "Whoever has “can interact” or “can edit” access to the artifact writes to the inventory. Read-only viewers see everything as read-only. Every write logs who and when."}, "Status do portal": {"es": "Estado del portal", "en": "Portal status"}, "O que já funciona, o que depende de alguém ligar e o que está no roteiro.": {"es": "Lo que ya funciona, lo que depende de que alguien lo active y lo que está en la hoja de ruta.", "en": "What already works, what depends on someone turning it on, and what's on the roadmap."}, "Dados FATO": {"es": "Datos HECHO", "en": "FACT data"}, "Dados PROVÁVEL": {"es": "Datos PROBABLE", "en": "LIKELY data"}, "Dados HIPÓTESE": {"es": "Datos HIPÓTESIS", "en": "HYPOTHESIS data"}, "Integrações": {"es": "Integraciones", "en": "Integrations"}, "Peça": {"es": "Ítem", "en": "Item"}, "Estado": {"es": "Estado", "en": "State"}, "Como funciona": {"es": "Cómo funciona", "en": "How it works"}, "Próximo passo": {"es": "Próximo paso", "en": "Next step"}, "Base compartilhada": {"es": "Base compartida", "en": "Shared base"}, "não ligado": {"es": "no activado", "en": "not enabled"}, "Inventário, sites, conexões, links, parceiros e status gravados no artifact; todos veem em tempo real.": {"es": "Inventario, sitios, conexiones, enlaces, socios y estado grabados en el artifact; todos ven en tiempo real.", "en": "Inventory, sites, connections, links, partners and status stored in the artifact; everyone sees it in real time."}, "Mapa e topologia": {"es": "Mapa y topología", "en": "Map and topology"}, "Desenhados a partir do inventário. Posições da topologia salvas por ativo.": {"es": "Dibujados a partir del inventario. Posiciones de la topología guardadas por activo.", "en": "Drawn from the inventory. Topology positions saved per asset."}, "Cadastrar os ativos dos outros 8 países.": {"es": "Registrar los activos de los otros 8 países.", "en": "Register the assets of the other 8 countries."}, "Script READ-ONLY dentro da rede → JSON → importação aqui.": {"es": "Script READ-ONLY dentro de la red → JSON → importación aquí.", "en": "READ-ONLY script inside the network → JSON → import here."}, "Agendar num jump host (Tarefa Agendada) para rodar sozinho.": {"es": "Programar en un jump host (Tarea Programada) para ejecutarse solo.", "en": "Schedule on a jump host (Scheduled Task) to run on its own."}, "Claude responde com base no inventário deste portal.": {"es": "Claude responde con base en el inventario de este portal.", "en": "Claude answers based on this portal's inventory."}, "Hoje só links.": {"es": "Hoy solo enlaces.", "en": "Today just links."}, "Avaliar API do Zabbix → Sweep lê estado de lá e evita teste duplicado.": {"es": "Evaluar API de Zabbix → Sweep lee el estado de ahí y evita prueba duplicada.", "en": "Evaluate the Zabbix API → Sweep reads status from there and avoids duplicate testing."}, "planejado": {"es": "planificado", "en": "planned"}, "Hoje os atalhos abrem o portal.": {"es": "Hoy los atajos abren el portal.", "en": "Today the shortcuts open the portal."}, "Importar VMs/Arc/NSG do Azure para o inventário via script (az graph query).": {"es": "Importar VMs/Arc/NSG de Azure al inventario vía script (az graph query).", "en": "Import VMs/Arc/NSG from Azure into the inventory via script (az graph query)."}, "ServiceDesk Plus Cloud tem API v3.": {"es": "ServiceDesk Plus Cloud tiene API v3.", "en": "ServiceDesk Plus Cloud has API v3."}, "Sincronizar CIs do CMDB com o inventário, com o SDP como fonte do ativo.": {"es": "Sincronizar CIs del CMDB con el inventario, con el SDP como fuente del activo.", "en": "Sync CIs from the CMDB with the inventory, with SDP as the asset's source."}, "E-mail diário": {"es": "Correo diario", "en": "Daily email"}, "Opcional: postar   h+='<h3>Status</h3><dl class="kv">'+row('Estado',K.pill(id))+row('Último teste',o.s?esc(K.fmtDate(o.s.at))+' ('+esc(K.ago(o.s.at))+')':'<span class="muted">nunca — rode o Orbiscale Sweep</span>')+row('Latência',o.s&&o.s.ms!=null?esc(o.s.ms)+' ms':'')+row('Método',o.s&&esc(o.s.method||''))+row('Origem',o.s&&esc(o.s.src||''))+'</dl>';

  h+='<h3>Acesso & teste</h3><p class="note">Comandos saem da <b>sua</b> máquina. Credencial fica no cofre (KeePass/RDM), nunca aqui.</p>'+K.nodeCmds(n).map(function(x){return K.cmdBlock(x)}).join('');
  h+='<p class="note" style="margin-top:14px">Atualizado '+esc(K.ago(n.updatedAt))+(who?' por '+esc(who):'')+'.</p>';
  if(S.canWrite)h+='<div id="delzone"><button class="btn sm danger" data-askdel="'+esc(id)+'">'+t('del')+' ativo</button></div>';
  h+='</div></aside>';$('layer').innerHTML=h;if(S.view==='topo')K.render()};

  var sites='<option value="">— sem site —</option>'+Object.keys(S.sites).sort().map(function(k){var s=S.sites[k];return '<option value="'+esc(k)+'"'+(k===n.site?' selected':'')+'>'+esc(s.country+' · '+s.name)+'</option>'}).join('');
  var f=function(k,l,ph,full,type){return '<div class="fld'+(full?' full':'')+'"><label for="f_'+k+'">'+esc(l)+'</label><input id="f_'+k+'" type="'+(type||'text')+'" value="'+esc(n[k]||'')+'" placeholder="'+esc(ph||'')+'"></div>'};
  K.modal('<header><h2>'+(id?t('edit')+' · '+esc(n.name):t('add'))+'</h2></header><form id="nf"><div class="body">'+
   f('name','Hostname / nome','FW-BR-SP-01')+

   '<div class="fld"><label for="f_country">País</label><select id="f_country">'+opt(K.COUNTRIES,n.country)+'</select></div>'+
   '<div class="fld"><label for="f_site">Site</label><select id="f_site">'+sites+'</select></div>'+
   f('ip','IP de gerência','10.0.0.1')+f('fqdn','FQDN','host.contoso.example')+f('port','Porta p/ teste TCP','443 (vazio = ICMP)',false,'number')+f('mgmtUrl','URL de gerência','https://…')+
   f('sshUser','Usuário SSH (nominal, sem senha)','jdoe')+f('zabbixUrl','Link no Zabbix','https://…')+
   f('vendor','Fabricante','Fortinet')+f('model','Modelo','FortiGate 100F')+f('version','Versão / firmware','7.4.x')+f('role','Função','Firewall de borda BR')+
   '<div class="fld"><label for="f_env">Ambiente</label><select id="f_env">'+opt(K.ENV,n.env)+'</select></div>'+
   '<div class="fld"><label for="f_conf">Confiança do dado</label><select id="f_conf">'+opt(K.CONF,n.conf)+'</select></div>'+
   f('os','Sistema operacional','Windows Server 2016')+f('serial','Service tag / serial','ABC1234')+f('owner','Responsável','Global Infra')+f('tags','Tags','ha, borda, sox')+
   '<div class="fld full"><label for="f_notes">Notas (nunca senha)</label><textarea id="f_notes">'+esc(n.notes||'')+'</textarea></div><div id="nfw" class="warnbox hide"></div>'+
   '</div><footer><button type="button" class="btn" data-close>'+t('cancel')+'</button><button type="submit" class="btn pri">'+t('save')+'</button></footer></form>');
  $('nf').addEventListener('submit',function(e){e.preventDefault();
    var d={};['name','type','country','site','ip','fqdn','port','mgmtUrl','sshUser','zabbixUrl','vendor','model','version','role','env','conf','owner','tags','notes','os','serial'].forEach(function(k){var el=$('f_'+k);d[k]=el?el.value.trim():''});
    d.port=d.port?parseInt(d.port,10):null;

/* ---------- formulário genérico ---------- */
K.formModal=function(title,fields,data,onSave){data=data||{};
  K.modal('<header><h2>'+esc(title)+'</h2></header><form id="gf"><div class="body">'+fields.map(function(f){var v=data[f.k]!=null?data[f.k]:(f.def||'');
    if(f.opts)return '<div class="fld'+(f.full?' full':'')+'"><label for="g_'+f.k+'">'+esc(f.l)+'</label><select id="g_'+f.k+'">'+Object.keys(f.opts).map(function(k){return '<option value="'+esc(k)+'"'+(k===v?' selected':'')+'>'+esc(f.opts[k].n||f.opts[k])+'</option>'}).join('')+'</select></div>';
    if(f.area)return '<div class="fld full"><label for="g_'+f.k+'">'+esc(f.l)+'</label><textarea id="g_'+f.k+'" placeholder="'+esc(f.ph||'')+'">'+esc(v)+'</textarea></div>';
    return '<div class="fld'+(f.full?' full':'')+'"><label for="g_'+f.k+'">'+esc(f.l)+'</label><input id="g_'+f.k+'" type="'+(f.type||'text')+'" value="'+esc(v)+'" placeholder="'+esc(f.ph||'')+'"></div>'}).join('')+'<div id="gfw" class="warnbox hide"></div></div><footer><button type="button" class="btn" data-close>'+t('cancel')+'</button><button type="submit" class="btn pri">'+t('save')+'</button></footer></form>');
  $('gf').addEventListener('submit',function(e){e.preventDefault();var d={};fields.forEach(function(f){d[f.k]=$('g_'+f.k).value.trim();if(f.type==='number')d[f.k]=d[f.k]===''?null:parseFloat(d[f.k])});
    var miss=fields.filter(function(f){return f.req&&!d[f.k]});if(miss.length){$('gfw').textContent='Preencha: '+miss.map(function(f){return f.l}).join(', ');$('gfw').classList.remove('hide');return}
    if(K.hasSecret(d)){$('gfw').innerHTML='<b>Parece senha, token ou chave.</b> Remova e guarde no cofre.';$('gfw').classList.remove('hide');return}
    if(fields.some(function(f){return f.url&&d[f.k]&&!/^https?:\/\//i.test(d[f.k])})){$('gfw').textContent='Links precisam começar com https://';$('gfw').classList.remove('hide');return}
    onSave(d)})};

/* =================== DADOS =================== */
var COLS=['nodes','links','sites','status','partners','qlinks','tuts','risks','portals','deadlines','voice'];
function subscribe(){COLS.forEach(function(col){S.db.collection(col).onSnapshot(function(snap){var m={};snap.docs.forEach(function(d){var v=d.data()||{};v.id=v.id||d.id;m[d.id]=v});if(snap.docs.length||!window.KNOC_SNAPSHOT||S.dbState==='ok')S[col]=m;S.dbState='ok';if(K._markLive)K._markLive();resolvePeople();K.renderNav();K.render()},function(err){console.warn('[Orbiscale]',col,err);S.dbWhy='erro ao ler "'+col+'": '+((err&&(err.code||err.message))||err);if(S.dbState!=='ok'){S.dbState=window.KNOC_SNAPSHOT?'snapshot':'err';K.renderNav();K.render()}})});
  S.db.collection('sweeps').orderBy('at','desc').limit(20).onSnapshot(function(snap){S.sweeps=snap.docs.map(function(d){var v=d.data()||{};v.id=d.id;return v});K.render()},function(){});
  S.db.doc('config/main').onSnapshot(function(d){S.cfg=(d.exists&&d.data())||{};K.render()},function(){});}
K.subEndpoints=function(){if(!S.db||S._epSub)return;S._epSub=true;S.epState='loading';S.db.collection('endpoints').onSnapshot(function(snap){var m={};snap.docs.forEach(function(d){var v=d.data()||{};v.id=v.id||d.id;m[d.id]=v});S.endpoints=m;S.epState='ok';K.render()},function(err){console.warn('[Orbiscale] endpoints',err);S.epState='err';S.epWhy=(err&&(err.code||err.message))||String(err);S._epSub=false;K.render()})};
var pq=null;function resolvePeople(){if(!S.user||!S.user.profiles)return;clearTimeout(pq);pq=setTimeout(function(){var ids={};['nodes','partners','qlinks','tuts'].forEach(function(c){Object.keys(S[c]).forEach(function(k){if(S[c][k].updatedBy)ids[S[c][k].updatedBy]=1})});S.sweeps.forEach(function(s){if(s.byId)ids[s.byId]=1});var a=Object.keys(ids).filter(function(x){return !S.people[x]});if(!a.length)return;S.user.profiles(a).then(function(p){Object.assign(S.people,p||{});K.render()},function(){})},400)}

K.reconnect=function(){if(!window.claude||!window.claude.use){K.toast('Sem runtime do Claude nesta visualização.');return}S.dbState='loading';K.renderNav();K.render();window.claude.use('db').then(function(db){if(!db){S.dbWhy='a base compartilhada não foi liberada para esta visualização';S.dbState=window.KNOC_SNAPSHOT?'snapshot':'err';K.renderNav();K.render();return}S.db=db;S.dbWhy=null;S._epSub=false;subscribe();if(S.view==='endp')K.subEndpoints()},function(e){S.dbWhy='falha ao abrir a base: '+((e&&(e.code||e.message))||e);S.dbState=window.KNOC_SNAPSHOT?'snapshot':'err';K.renderNav();K.render()})};
K.boot=function(){
  var th=K.ls('knoc.theme')||'auto';applyTheme(th);
  [].forEach.call($('theme').children,function(b){b.onclick=function(){applyTheme(b.dataset.t);K.ls('knoc.theme',b.dataset.t)}});
  [].forEach.call($('lang').children,function(b){b.setAttribute('aria-pressed',String(b.dataset.l===K.getL()));b.onclick=function(){K.setL(b.dataset.l);[].forEach.call($('lang').children,function(x){x.setAttribute('aria-pressed',String(x===b))});$('gq').placeholder=t('search');K.renderNav();K.render()}});
  var h=(location.hash||'').slice(1);S.view=K.V[h]?h:(K.ls('knoc.view')||'home');if(!K.V[S.view])S.view='home';
  var SN=window.KNOC_SNAPSHOT;if(SN){['nodes','links','sites','status','partners','qlinks','tuts','risks','portals','deadlines','voice','endpoints'].forEach(function(c){S[c]=SN[c]||{}});S.cfg=SN.config||{};S.sweeps=SN.sweeps||[];S.dbState='snapshot'}
  K.initSearch();K.renderNav();K.render();
  var live=false;setTimeout(function(){if(!live&&!S.dbWhy)S.dbWhy='a base não respondeu em 8 s';if(!live&&SN){console.warn('[Orbiscale] base ao vivo não respondeu; usando cópia embutida');S.dbState='snapshot';K.renderNav();K.render()}},8000);
  K._markLive=function(){live=true};
  if(!window.claude||!window.claude.use){S.dbWhy='esta visualização não tem o runtime do Claude (prévia ou arquivo local)';S.dbState=SN?'snapshot':'err';K.renderNav();K.render();return}
  window.claude.use('db').then(function(db){if(!db){S.dbWhy='a base compartilhada não foi liberada para esta visualização';console.warn('[Orbiscale] claude.use("db") retornou null');S.dbState=SN?'snapshot':'err';K.renderNav();K.render();return}S.db=db;S.dbWhy=null;subscribe();if(S.view==='endp')K.subEndpoints()},function(e){S.dbWhy='falha ao abrir a base: '+((e&&(e.code||e.message))||e);console.warn('[Orbiscale] db falhou',e);S.dbState=SN?'snapshot':'err';K.renderNav();K.render()});
  window.claude.use('user').then(function(u){if(!u){S.canWrite=true;K.renderNav();K.render();return}S.user=u;
    u.me().then(function(me){S.me=me;if(me&&me.name){$('whoName').textContent=me.name.split(' ')[0];if(me.avatarUrl)$('whoImg').src=me.avatarUrl;else $('whoImg').remove();$('who').classList.remove('hide')}},function(){});
    u.can('data.write').then(function(ok){S.canWrite=ok!==false;K.renderNav();K.render()},function(){S.canWrite=true});
  },function(){});
  setInterval(function(){if(['home','map','mon','inv'].indexOf(S.view)>-1)K.render()},60000);
};
function applyTheme(v){var r=document.documentElement;if(v==='auto')r.removeAttribute('data-theme');else r.setAttribute('data-theme',v);[].forEach.call($('theme').children,function(b){b.setAttribute('aria-pressed',String(b.dataset.t===v))})}
})();

(function(){

/* =================== VISÃO GERAL =================== */

   '<h2 style="font-size:17px;margin-top:16px">Atalhos</h2><div class="acts" style="margin-top:6px">'+['Microsoft Sentinel','Defender XDR','Máquinas virtuais','Teams admin','ServiceDesk Plus Cloud','Entra ID'].map(function(n){var l=K.OFFICIAL(S.cfg).filter(function(x){return x.title===n})[0];return l?'<a class="btn sm" href="'+esc(l.url)+'" target="_blank" rel="noopener">'+esc(n)+' ↗</a>':''}).join('')+'</div></div></section></div>';

/* =================== DOCUMENTAÇÃO =================== */
var DOCS={
 uso:{n:'Como usar',h:'<h3>Em 1 minuto</h3><ol><li><b>/</b> abre a busca global: ativo, IP, site, parceiro, link ou playbook.</li><li><b>Mapa</b> mostra onde a Contoso está e o que está fora. Clique num país para ver sites e ativos.</li><li><b>Topologia</b> é a vista estilo EVE-NG. Filtre por país, arraste o fundo, role para zoom. Clique num ativo para ver acesso e comandos.</li><li><b>Inventário</b> é a fonte: tudo que aparece no mapa e na topologia nasce aqui.</li><li><b>Troubleshooting</b> tem o playbook por camada com comandos já preenchidos com o host que você está investigando.</li><li><b>Assistente</b> responde perguntas sobre o inventário (“qual o IP do firewall do Brasil?”, “o que está fora?”).</li></ol><h3>Quem pode editar</h3><p>Quem tem acesso “pode interagir” ou “pode editar” ao artifact grava no inventário. Quem só visualiza vê tudo em leitura. Toda gravação registra quem e quando.</p>'},
 cad:{n:'Padrão de cadastro',h:'<h3>Nome</h3><p>Hostname real, em maiúsculas como está no equipamento (ex.: <code>FW-BR-SP-01</code>, <code>DC-HQ-01</code>). Sem apelido.</p><h3>Site</h3><p>Todo ativo físico pertence a um site. Recurso de nuvem fica sem site e país “Cloud / SaaS”.</p><h3>IP e porta de teste</h3><p>IP de <b>gerência</b>. Porta de teste é a que prova que o serviço está vivo (443 no FortiGate, 3389 num servidor Windows, 5061 no SBC). Vazio = teste por ICMP.</p><h3>Confiança do dado</h3><p><b>FATO</b> conferido no equipamento ou console · <b>PROVÁVEL</b> veio de documentação/planilha, falta conferir · <b>HIPÓTESE</b> placeholder a validar.</p><h3>Conexões</h3><p>Na Topologia, modo Editar → Conectar. Use o tipo certo (LAN, WAN, VPN, HA, SIP) e rotule porta/VLAN/circuito.</p>'},
 seg:{n:'Segurança',h:'<h3>Não é cofre</h3><p>Nenhuma senha, token, chave privada, connection string ou segredo entra aqui. O formulário bloqueia texto que parece segredo. Credencial fica no KeePass LATAM, RDM ou Azure Key Vault.</p><h3>O que pode</h3><ul><li>Hostname, IP interno, FQDN, porta, versão, função.</li><li>Usuário SSH <b>nominal</b> (o seu), nunca conta compartilhada.</li><li>Links de console e de chamado.</li></ul><h3>Quem vê</h3><p>O artifact com base compartilhada é interno da organização e não pode virar link público. Mesmo assim, IP interno e topologia são informação sensível: compartilhe só com a equipe de Infra e coordenação (LGPD / SOX / ITGC).</p><h3>Achou segredo em algum lugar?</h3><p>Reporte onde apareceu, recomende rotação e não reproduza o valor.</p>'},
 st:{n:'Como o status funciona',h:'<h3>Fluxo</h3><ol><li>Inventário → Exportar alvos → <code>knoc-targets.json</code>.</li><li>Máquina dentro da rede roda <code>Invoke-KnocSweep.ps1</code> (ICMP ou TCP).</li><li>Monitoria → importar <code>knoc-sweep-*.json</code>.</li><li>O portal grava estado, latência e horário por ativo e registra o Sweep no histórico.</li></ol><h3>Cores</h3><ul><li><b>online</b> respondeu no último teste, há menos de 60 min.</li><li><b>degradado</b> respondeu com mais de 300 ms.</li><li><b>fora</b> não respondeu no último teste.</li><li><b>sem status / antigo</b> nunca testado, ou teste com mais de 60 min.</li></ul><h3>Limite</h3><p>ICMP bloqueado aparece como fora. Para esses ativos, preencha uma porta TCP de teste. TCP aberto prova a porta, não a aplicação.</p>'}
};

function md(s){var h=esc(s);h=h.replace(/```([\s\S]*?)```/g,function(_,c){return '<pre class="mono" style="background:var(--canvas);color:var(--canvas-ink);padding:8px 10px;border-radius:6px;overflow-x:auto;white-space:pre;margin:6px 0">'+c.replace(/^\w*\n/,'')+'</pre>'});h=h.replace(/`([^`\n]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>');return h}
V.ai=function(el){
  var h=K.head('Conhecimento','Assistente','Pergunte sobre o inventário, o status e os playbooks deste portal. Ele consulta os dados antes de responder e não executa nada na rede.');
  h+='<div class="panel chat"><div class="msgs" id="msgs"></div><div class="sugg" id="sugg"></div><div class="composer"><textarea id="ain" rows="1" placeholder="Ex.: qual o IP do FW-BR-SP-01 e como acesso?"></textarea><button class="btn pri" id="asend">Enviar</button></div></div><p class="note" style="margin-top:8px">Cada pergunta usa a cota de Claude de quem pergunta. Na primeira vez o navegador pede permissão.</p>';
  el.innerHTML=h;drawChat();
  $('asend').onclick=send;$('ain').onkeydown=function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();send()}};
  if(SAMPLE_STATE==='unknown'&&window.claude&&window.claude.use)window.claude.use('sample').then(function(s){SAMPLE=s;SAMPLE_STATE=s?'ok':'off';drawChat()},function(){SAMPLE_STATE='off';drawChat()});
};
function drawChat(){var m=$('msgs');if(!m)return;
  if(!CHAT.length)m.innerHTML='<div class="msg a">Oi. Eu leio o inventário, o status do último Sweep e os playbooks deste portal. Pergunte algo como “o que está fora?” ou “como testo o SBC?”.</div>'+(SAMPLE_STATE==='off'?'<div class="msg tool">Assistente indisponível nesta visualização.</div>':'');
  else m.innerHTML=CHAT.map(function(c){return '<div class="msg '+(c.role==='user'?'u':c.role==='tool'?'tool':'a')+'">'+(c.role==='assistant'?md(c.content):esc(c.content))+'</div>'}).join('');
  m.scrollTop=m.scrollHeight;
  var sg=$('sugg');if(sg)sg.innerHTML=CHAT.length?'':['O que está fora agora?','Quais ativos do Brasil estão sem IP?','Como acesso o FW-BR-SP-01?','Passo a passo para SBC inativo no Teams','Onde está o Sentinel?'].map(function(s){return '<button data-sg="'+esc(s)+'">'+esc(s)+'</button>'}).join('');
  if(sg)sg.onclick=function(e){var b=e.target.closest('[data-sg]');if(b){$('ain').value=b.dataset.sg;send()}};
  var btn=$('asend');if(btn){btn.textContent=busy?'Parar':'Enviar';btn.disabled=SAMPLE_STATE==='off'}}
function send(){if(busy){if(ctrl)ctrl.abort();return}var q=$('ain').value.trim();if(!q||!SAMPLE)return;$('ain').value='';
  CHAT.push({role:'user',content:q});var turns=CHAT.filter(function(c){return c.role!=='tool'}).map(function(c,i){return{role:c.role,content:i===0?SYS+'\n\nPERGUNTA: '+c.content:c.content}});
  var ans={role:'assistant',content:'…'};CHAT.push(ans);busy=true;ctrl=new AbortController();drawChat();
  var tools=TOOLS.map(function(tl){return{name:tl.name,description:tl.description,inputSchema:tl.inputSchema,execute:function(input){CHAT.splice(CHAT.indexOf(ans),0,{role:'tool',content:'consultando '+tl.name+'…'});drawChat();return tl.execute(input||{})}}});
  SAMPLE(turns,{tools:tools,signal:ctrl.signal,cache:false,onText:function(u){ans.content=u.text;drawChat()}}).then(function(r){ans.content=r.text||ans.content},function(err){var c=err&&err.code;ans.content=c==='cancelled'?(err.text||'(parado)'):c==='not_granted'?'Sem permissão para usar o assistente nesta página.':c==='rate_limited'?'Limite de uso atingido. Tente em alguns minutos.':'Não consegui responder: '+(err&&err.message||c||'erro');if(c==='not_granted'){SAMPLE_STATE='off'}}).then(function(){busy=false;ctrl=null;drawChat()})}

/* =================== BOOT =================== */
K.boot();
})();
</script>
