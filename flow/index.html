<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Source+Sans+3:wght@400;600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>.brand .flow-home{text-decoration:none;color:var(--accent);margin-right:6px;font-weight:700}
  :root{
    --ground:#F5F7F7; --surface:#FFFFFF; --surface-2:#EDF1F1; --raise:0 1px 2px rgba(20,26,28,.06),0 1px 1px rgba(20,26,28,.04);
    --ink:#141A1C; --ink-2:#4F5D60; --ink-3:#6F7F82;
    --line:#DCE3E3; --line-soft:#EAEFEF;
    --accent:#0F6068; --accent-ink:#FFFFFF; --accent-soft:#E2EFF0;
    --crit:#B3261E; --crit-bg:#FCEBE9; --warn:#8F5400; --warn-bg:#FCF2E2;
    --ok:#1C6741;  --ok-bg:#E5F3EB;  --stale:#5B5870; --stale-bg:#EEEDF3;
    /* dados — validados com o validador de paleta (azul/cinza/vermelho) */
    --v-run:#2a78d6; --v-pause:#A3ADB0; --v-late:#D03A38; --v-track:#EDF1F1;
    --v-s1:#9DC1EE; --v-s2:#4B8FE0; --v-s3:#1F5AA6;
    --display:'Archivo','Helvetica Neue',Arial,sans-serif;
    --body:'Source Sans 3','Segoe UI',system-ui,sans-serif;
    --mono:'IBM Plex Mono','SF Mono',Consolas,monospace;
    --r:8px;
  }
  @media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
    --ground:#0E1315; --surface:#171E20; --surface-2:#202A2C; --raise:0 1px 2px rgba(0,0,0,.4);
    --ink:#E7EEED; --ink-2:#A5B2B1; --ink-3:#8A9897;
    --line:#2A3537; --line-soft:#212B2D;
    --accent:#5CC0C9; --accent-ink:#0E1315; --accent-soft:#133439;
    --crit:#F2938A; --crit-bg:#3B1D1A; --warn:#E3A94F; --warn-bg:#3A2D13;
    --ok:#6BCB96;  --ok-bg:#153227;  --stale:#ABA5D1; --stale-bg:#262434;
    --v-run:#3987e5; --v-pause:#5E686A; --v-late:#E66767; --v-track:#202A2C;
    --v-s1:#2C4F7A; --v-s2:#3987e5; --v-s3:#9CC4F7;
  }}
  :root[data-theme="dark"]{
    --ground:#0E1315; --surface:#171E20; --surface-2:#202A2C; --raise:0 1px 2px rgba(0,0,0,.4);
    --ink:#E7EEED; --ink-2:#A5B2B1; --ink-3:#8A9897;
    --line:#2A3537; --line-soft:#212B2D;
    --accent:#5CC0C9; --accent-ink:#0E1315; --accent-soft:#133439;
    --crit:#F2938A; --crit-bg:#3B1D1A; --warn:#E3A94F; --warn-bg:#3A2D13;
    --ok:#6BCB96;  --ok-bg:#153227;  --stale:#ABA5D1; --stale-bg:#262434;
    --v-run:#3987e5; --v-pause:#5E686A; --v-late:#E66767; --v-track:#202A2C;
    --v-s1:#2C4F7A; --v-s2:#3987e5; --v-s3:#9CC4F7;
  }

  *{box-sizing:border-box}
  html,body{overflow-x:hidden}
  body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.55;margin:0}
  .wrap{max-width:1080px;margin:0 auto;padding:0 16px 72px}
  button{font-family:inherit}
  button:focus-visible,a:focus-visible,summary:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

  /* ---------- topo ---------- */
  header.top{position:sticky;top:0;z-index:40;background:var(--ground);border-bottom:1px solid var(--line)}
  .bar{max-width:1080px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .brand{font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:-.01em;white-space:nowrap}
  .brand span{display:block;font-family:var(--mono);font-size:9.5px;font-weight:400;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
  nav.main{display:flex;gap:2px;flex:1 1 auto;flex-wrap:wrap}
  nav.main button{font-size:13.5px;font-weight:600;padding:6px 11px;border:0;border-radius:6px;background:transparent;color:var(--ink-2);cursor:pointer;white-space:nowrap}
  nav.main button[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
  nav.main button:hover:not([aria-current]){background:var(--surface-2)}
  .tools{display:flex;align-items:center;gap:6px;margin-left:auto}
  .seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--surface)}
  .seg button{font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.05em;padding:5px 8px;border:0;background:transparent;color:var(--ink-2);cursor:pointer}
  .seg button+button{border-left:1px solid var(--line)}
  .seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
  .who{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:3px 10px 3px 3px;max-width:180px}
  .who[hidden]{display:none}
  .who img{width:22px;height:22px;border-radius:50%;flex:0 0 auto}
  .who b{font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  /* ---------- menu ---------- */
  .shbtn{font-size:13px;font-weight:600;padding:5px 11px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
  .shbtn:hover{border-color:var(--accent);color:var(--accent)}
  .menu{position:relative}
  .menu>button{font-size:13px;font-weight:600;padding:5px 11px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--ink);cursor:pointer}
  .menu>button[aria-expanded="true"]{border-color:var(--accent);color:var(--accent)}
  .pop{position:absolute;right:0;top:calc(100% + 6px);width:270px;max-width:calc(100vw - 32px);background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 8px 24px rgba(0,0,0,.14);padding:6px;z-index:60}
  .pop .grp{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);padding:8px 10px 4px}
  .pop button{display:flex;gap:9px;align-items:center;width:100%;text-align:left;font-size:13.5px;padding:7px 10px;border:0;border-radius:6px;background:transparent;color:var(--ink);cursor:pointer}
  .pop button:hover{background:var(--surface-2)}
  .pop button small{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
  .pop .meta{font-size:11.5px;color:var(--ink-3);padding:6px 10px 4px;border-top:1px solid var(--line-soft);margin-top:4px}

  /* ---------- filtros ---------- */
  .fbox{max-width:1080px;margin:0 auto;padding:0 16px 10px}
  .fcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--raise);overflow:hidden}
  .srow{display:flex;gap:8px;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line)}
  .search{flex:1 1 auto;display:flex;align-items:center;gap:7px;background:var(--ground);border:1px solid var(--line);border-radius:6px;padding:0 9px}
  .search input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font-family:var(--body);font-size:14px;padding:7px 0}
  .search input:focus{outline:0}
  .search:focus-within{border-color:var(--accent)}
  .search .ic{color:var(--ink-3);font-size:13px}
  .search button{border:0;background:transparent;color:var(--ink-3);cursor:pointer;font-size:14px;padding:2px 4px}
  .dims{display:flex;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:thin}
  .dims button{flex:0 0 auto;font-size:12.5px;font-weight:600;padding:9px 13px;border:0;background:transparent;color:var(--ink-2);cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
  .dims button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
  .dims .n{display:inline-block;min-width:16px;height:16px;line-height:16px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-family:var(--mono);font-size:9.5px;margin-left:5px;text-align:center;padding:0 4px}
  .chips{display:flex;flex-wrap:wrap;gap:5px;padding:10px 12px;max-height:132px;overflow-y:auto}
  .chip{font-size:12.5px;color:var(--ink-2);background:var(--ground);border:1px solid var(--line);padding:4px 10px 4px 8px;border-radius:14px;cursor:pointer;display:inline-flex;align-items:center;gap:5px}
  .chip .bx{width:12px;height:12px;border:1.5px solid var(--ink-3);border-radius:3px;display:inline-block;flex:0 0 auto}
  .chip .c{font-family:var(--mono);font-size:10.5px;color:var(--ink-3)}
  .chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  .chip[aria-pressed="true"] .bx{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 2px var(--surface)}
  .chip.sep{border:0;background:transparent;cursor:default;font-family:var(--mono);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);padding-left:4px;width:100%}
  .chip.act{border-style:dashed}
  .status{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:0 12px 10px;font-size:12px;color:var(--ink-3)}
  .status b{color:var(--ink);font-weight:600;font-variant-numeric:tabular-nums}
  .pill{font-family:var(--mono);font-size:10.5px;background:var(--accent-soft);color:var(--accent);border:1px solid var(--accent);padding:2px 8px;border-radius:12px;cursor:pointer}
  .pill::after{content:" ×";font-weight:700}
  .btn{font-size:12px;color:var(--ink-2);background:transparent;border:1px solid var(--line);padding:4px 11px;border-radius:14px;cursor:pointer}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}

  /* ---------- KPIs ---------- */
  .kpis{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));margin-top:16px}
  .kpi{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;box-shadow:var(--raise);cursor:pointer;color:inherit;position:relative;transition:border-color .12s}
  .kpi:hover{border-color:var(--accent)}
  .kpi[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft),var(--raise)}
  .kpi .n{font-family:var(--display);font-weight:700;font-size:25px;font-variant-numeric:tabular-nums;line-height:1.1}
  .kpi .l{font-size:12.5px;color:var(--ink);margin-top:2px;font-weight:600}
  .kpi .x{font-size:11.5px;color:var(--ink-3);margin-top:3px;line-height:1.35}
  .kpi .go{position:absolute;top:9px;right:10px;font-size:11px;color:var(--ink-3)}
  .kpi.c .n{color:var(--crit)} .kpi.w .n{color:var(--warn)} .kpi.o .n{color:var(--ok)} .kpi.a .n{color:var(--accent)}

  /* ---------- seções ---------- */
  section{margin-top:26px}
  .sh{display:flex;align-items:baseline;gap:9px;flex-wrap:wrap;margin-bottom:9px}
  h2{font-family:var(--display);font-weight:600;font-size:16.5px;margin:0}
  .sc{font-family:var(--mono);font-size:11px;color:var(--ink-3)}
  .snote{font-size:12.5px;color:var(--ink-3);margin:-2px 0 10px;max-width:80ch}

  /* ---------- cards ---------- */
  .cards{display:flex;flex-direction:column;gap:8px}
  .card{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--line);border-radius:var(--r);box-shadow:var(--raise);overflow:hidden}
  .card.crit{border-left-color:var(--crit)} .card.warn{border-left-color:var(--warn)}
  .card.ok{border-left-color:var(--ok)} .card.stale{border-left-color:var(--stale)}
  .chead{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;padding:11px 13px;cursor:pointer;align-items:start}
  .chead:hover{background:var(--surface-2)}
  .ctitle{font-size:14.5px;line-height:1.35;grid-column:1;overflow-wrap:anywhere}
  .cid{font-family:var(--mono);font-size:11.5px;font-weight:600;color:var(--accent);margin-right:6px}
  .cmeta{grid-column:1;font-size:12px;color:var(--ink-2);margin-top:1px}
  .ctags{grid-column:1;margin-top:7px;display:flex;flex-wrap:wrap;gap:4px}
  .cright{grid-column:2;grid-row:1/span 3;text-align:right;white-space:nowrap;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
  .age{font-family:var(--mono);font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
  .age.crit{color:var(--crit)} .age.warn{color:var(--warn)} .age.ok{color:var(--ok)} .age.stale{color:var(--stale)}
  .agel{font-size:9.5px;color:var(--ink-3);letter-spacing:.05em;text-transform:uppercase}
  .more{font-size:11.5px;color:var(--accent);font-weight:600;border:0;background:transparent;cursor:pointer;padding:0;margin-top:4px}
  .cbody{font-size:13px;color:var(--ink-2);max-width:78ch;border-top:1px solid var(--line-soft);padding-top:10px;margin:0 13px 13px}
  .card[data-open="0"] .cbody{display:none}
  .tag{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.04em;padding:2px 7px;border-radius:10px;border:1px solid transparent;cursor:pointer;background:none}
  .tag.g{background:var(--surface-2);color:var(--ink-2)}
  .tag.g:hover{border-color:var(--accent);color:var(--accent)}
  .tag.P0{background:var(--crit-bg);color:var(--crit)} .tag.P1{background:var(--warn-bg);color:var(--warn)} .tag.P2{background:var(--stale-bg);color:var(--stale)}
  .tag.me{background:var(--accent-soft);color:var(--accent);cursor:default}
  mark{background:var(--warn-bg);color:inherit;border-radius:2px;padding:0 1px}

  /* ---------- pessoa ---------- */
  .person{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--raise);margin-top:14px}
  .person h3{font-family:var(--display);font-size:17px;margin:0 0 3px}
  .person p{margin:0;font-size:13px;color:var(--ink-2);max-width:78ch}
  .pstats{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px}
  .pstats div{font-size:12px;color:var(--ink-3)}
  .pstats b{display:block;font-family:var(--display);font-size:19px;color:var(--ink);font-variant-numeric:tabular-nums}
  .pstats b.c{color:var(--crit)}

  /* ---------- blocos ---------- */
  .box{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:var(--r);padding:12px 14px;box-shadow:var(--raise);margin-top:9px}
  .box.crit{border-left-color:var(--crit)} .box.warn{border-left-color:var(--warn)}
  .box.ok{border-left-color:var(--ok)} .box.stale{border-left-color:var(--stale)}
  .box h3{font-family:var(--display);font-size:14px;margin:0 0 4px}
  .box p{margin:0;font-size:13px;color:var(--ink-2);max-width:80ch}
  .box ul{margin:4px 0 0;padding-left:18px;font-size:13px;color:var(--ink-2)} .box li{margin-bottom:3px}
  .empty{padding:30px 16px;text-align:center;color:var(--ink-3);font-size:13.5px;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}

  /* ---------- tabelas ---------- */
  .tbl{width:100%;border-collapse:collapse;font-size:13px}
  .tbl th,.tbl td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line-soft);vertical-align:top}
  .tbl th{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
  .tbl td.num,.tbl th.num{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--mono);font-size:12px}
  .tbl td.id{font-family:var(--mono);font-size:12px;color:var(--accent);white-space:nowrap}
  .tbl tr.late td.num{color:var(--crit);font-weight:600}
  .tscroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--raise)}
  .st{font-family:var(--mono);font-size:10px;padding:1px 6px;border-radius:9px;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
  .st.p{background:var(--stale-bg);color:var(--stale)} .st.l{background:var(--crit-bg);color:var(--crit)}

  /* ---------- relatórios / gráficos ---------- */
  .grid2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}
  .viz{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--raise);padding:14px 16px}
  .viz h3{font-family:var(--display);font-size:14.5px;margin:0}
  .viz .vs{font-size:12px;color:var(--ink-3);margin:2px 0 12px}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin:-4px 0 10px}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
  .hb{display:grid;grid-template-columns:minmax(84px,120px) minmax(0,1fr) 34px;gap:4px 10px;align-items:center}
  .hb .lb{font-size:12.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hb .lb.dim{color:var(--ink-3)}
  .hb .tr{display:flex;gap:2px;height:14px;cursor:pointer;border-radius:0 4px 4px 0}
  .hb .tr:hover .sg{filter:brightness(1.08)}
  .hb .sg{height:100%;min-width:2px}
  .hb .sg:last-child{border-radius:0 4px 4px 0}
  .hb .vl{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);text-align:right;font-variant-numeric:tabular-nums}
  .hb .row{display:contents}
  .cols{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:18px;border-bottom:1px solid var(--line)}
  .cols .cl{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;cursor:pointer}
  .cols .cb{width:100%;max-width:56px;background:var(--v-run);border-radius:4px 4px 0 0;min-height:2px}
  .cols .cv{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);margin-bottom:3px}
  .cols-x{display:flex;gap:10px}
  .cols-x span{flex:1;text-align:center;font-size:11.5px;color:var(--ink-3);padding-top:5px}
  .viz details{margin-top:10px;font-size:12.5px}
  .viz summary{cursor:pointer;color:var(--accent);font-weight:600;font-size:12px}
  .viz details .tbl{margin-top:6px}
  .tiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
  .tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;box-shadow:var(--raise)}
  .tile .n{font-family:var(--display);font-weight:700;font-size:24px;font-variant-numeric:tabular-nums;line-height:1.1}
  .tile .l{font-size:12px;color:var(--ink-2);margin-top:2px}
  .tile.c .n{color:var(--crit)} .tile.w .n{color:var(--warn)} .tile.o .n{color:var(--ok)}
  .meter{height:8px;background:var(--v-track);border-radius:4px;overflow:hidden;margin-top:8px}
  .meter i{display:block;height:100%;background:var(--v-run);border-radius:0 4px 4px 0}
  .tgl{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--ink-2);cursor:pointer;user-select:none}
  .tgl input{accent-color:var(--accent)}
  #tip{position:fixed;z-index:90;pointer-events:none;background:var(--ink);color:var(--ground);font-size:12px;line-height:1.4;padding:6px 9px;border-radius:6px;max-width:240px;box-shadow:0 4px 14px rgba(0,0,0,.2);display:none}
  #tip b{font-weight:600}

  /* ---------- matriz ---------- */
  .mx td.ck{text-align:center;font-size:14px}

    $('mlbl').textContent=u('menu');
    var h='<div class="grp">'+esc(u('qv'))+'</div>'+QV.map(function(q){var n=all().filter(function(it){return DIMS.every(function(d){return !q[2][d]||vals(it,d).some(function(x){return has(q[2][d],x)})})}).length;
      return '<button data-qv="'+q[0]+'">'+q[1]+' '+esc(u(q[0]))+'<small>'+n+'</small></button>'}).join('')+
      '<div class="grp">'+esc(u('act'))+'</div>'+
      '<button data-a="copy">📋 '+esc(u('a1'))+'<small>Teams</small></button><button data-a="exp">↕ '+esc(u('a2'))+'</button><button data-a="col">↔ '+esc(u('a3'))+'</button>'+
      '<button data-a="tour">▶ '+esc(L==='en'?'Guided tour':L==='es'?'Tour guiado':'Tour guiado')+'</button>'+
      '<button data-a="print">🖨️ '+esc(u('a4'))+'</button><button data-a="clr">↺ '+esc(u('a5'))+'</button>'+
      '<div class="meta">'+esc(u('upd'))+': '+esc(T[L].stamp)+'<br>'+esc(tx(SDP.src))+'</div>';
    $('pop').innerHTML=h;
    [].forEach.call($('pop').querySelectorAll('[data-qv]'),function(b){b.onclick=function(){var q=QV.filter(function(x){return x[0]===b.dataset.qv})[0];
      setF(q[2]); Q=''; $('q').value=''; dim=Object.keys(q[2])[0]; VIEW='board'; toggleMenu(false); rerender(); window.scrollTo({top:0})}});
    [].forEach.call($('pop').querySelectorAll('[data-a]'),function(b){b.onclick=function(){var a=b.dataset.a; toggleMenu(false);
      if(a==='copy')copySummary();
      if(a==='exp'||a==='col'){var o=a==='exp'; [].forEach.call(document.querySelectorAll('.card'),function(c){if(c.querySelector('.cbody')){c.dataset.open=o?1:0;open[c.dataset.k]=o;var m=c.querySelector('.more');if(m)m.textContent=o?u('less'):u('more')}})}
      if(a==='print'){try{window.print()}catch(e){}}
      if(a==='tour'&&window.BLT)BLT.start();
      if(a==='clr'){setF(null);Q='';$('q').value='';rerender()}
    }});
  }
  function toggleMenu(v){menuOpen=v==null?!menuOpen:v; var p=$('pop'); p.classList.toggle('hide',!menuOpen); $('mbtn').setAttribute('aria-expanded',String(menuOpen));
    if(menuOpen&&innerWidth<620){p.style.position='fixed';p.style.left='16px';p.style.right='16px';p.style.width='auto';p.style.top=($('mbtn').getBoundingClientRect().bottom+6)+'px';p.style.maxHeight=(innerHeight-$('mbtn').getBoundingClientRect().bottom-20)+'px';p.style.overflowY='auto'}
    else if(menuOpen){p.style.cssText=''}}
  function copySummary(){
    var list=all().filter(match), lines=[];
    var f=[]; DIMS.forEach(function(d){if(F[d].length)f.push(dimName(d)+': '+F[d].map(function(v){return label(d,v)}).join(', '))}); if(Q)f.push('“'+Q+'”');
    lines.push('🤖 Backlog Infra LATAM · '+T[L].stamp); if(f.length)lines.push('🔎 '+f.join(' · ')); lines.push('');
    list.slice(0,25).forEach(function(it){lines.push('• '+(it.pr?'['+it.pr+'] ':'')+(it.c?it.c+' — ':'')+tx(it.t)+' · '+oname(it.o,1)+(it.age?' · '+it.age:''))});
    if(list.length>25)lines.push('… +'+(list.length-25));
    var txt=lines.join('\n');
    var done=function(){toast(u('copied'))}, fail=function(){showText(txt)};
    try{ if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(done,fail); else fail() }catch(e){fail()}
  }
  function showText(txt){var m=document.createElement('div');m.className='modal';
    m.innerHTML='<div class="in"><div class="sh"><h2>'+esc(u('copyT'))+'</h2><button class="btn" style="margin-left:auto">'+esc(u('close'))+'</button></div><textarea readonly></textarea></div>';
    m.querySelector('textarea').value=txt; document.body.appendChild(m); m.querySelector('textarea').select();
    m.onclick=function(e){if(e.target===m||e.target.tagName==='BUTTON')m.remove()}}
  function toast(s){var t=document.createElement('div');t.className='toast';t.textContent=s;document.body.appendChild(t);setTimeout(function(){t.remove()},2200)}

  /* ---------- tooltip ---------- */
  var tip=$('tip');
  document.addEventListener('mousemove',function(e){var el=e.target.closest&&e.target.closest('[data-tip]');
    if(!el){tip.style.display='none';return} tip.innerHTML=el.getAttribute('data-tip'); tip.style.display='block';
    var x=e.clientX+14,y=e.clientY+14,w=tip.offsetWidth,hh=tip.offsetHeight;
    if(x+w>innerWidth-8)x=e.clientX-w-14; if(y+hh>innerHeight-8)y=e.clientY-hh-14; tip.style.left=x+'px'; tip.style.top=y+'px'});
  document.addEventListener('scroll',function(){tip.style.display='none'},{passive:true});

  /* ---------- render ---------- */
  function render(){
    var t=T[L];
    document.documentElement.lang=L==='pt'?'pt-BR':L;
    $('nav').innerHTML=Object.keys(NAV[L]).map(function(k){return '<button data-v="'+k+'"'+(k===VIEW?' aria-current="page"':'')+'>'+esc(NAV[L][k])+'</button>'}).join('');
    [].forEach.call($('nav').children,function(b){b.onclick=function(){VIEW=b.dataset.v;render();window.scrollTo({top:0})}});
    $('fbox').classList.toggle('hide',VIEW!=='board');
    $('q').placeholder=u('search'); $('qx').classList.toggle('hide',!Q);
    $('lOf').textContent=t.of; $('lItems').textContent=t.items; $('clear').textContent=t.clear;
    $('cShow').textContent=all().filter(match).length; $('cTot').textContent=all().length;
    $('f1').innerHTML=t.foot1; $('f2').innerHTML=t.foot2; $('f3').innerHTML=t.foot3;
    renderDims(); renderChips(); renderActive(); renderMenu();
    var v=$('view');
    v.innerHTML = VIEW==='board'?boardView() : VIEW==='sd'?sdView() : VIEW==='rep'?repView() : VIEW==='cap'?(window.BLC?BLC.view():'') : VIEW==='met'?(window.BLM?BLM.view():'') : VIEW==='daily'?dailyView() : VIEW==='docs'?docsView() : VIEW==='ai'?(window.BLX?BLX.view():'') : statusView();
    wire(v); wireKpis(v);
    if(VIEW==='docs')[].forEach.call(v.querySelectorAll('.subnav button'),function(b){b.onclick=function(){DOCPAGE=b.dataset.p;render()}});
    if(VIEW==='rep')wireRep(v);
    if(VIEW==='cap'&&window.BLC)BLC.after(v);
    if(VIEW==='met'&&window.BLM)BLM.after(v);
    if(VIEW==='board')wireBoard(v);
    if(VIEW==='sd'){sdFill(); $('sdq').oninput=function(){SDQ=this.value;sdFill()}}
    if(window.BLX&&BLX.after)BLX.after(VIEW);
  }

  /* ---------- controles ---------- */
  var qt; $('q').oninput=function(){var s=this.value; clearTimeout(qt); qt=setTimeout(function(){Q=s.trim(); $('qx').classList.toggle('hide',!Q); renderDims();renderChips();renderActive();
    $('cShow').textContent=all().filter(match).length; var v=$('view'); v.innerHTML=boardView(); wire(v); wireKpis(v); wireBoard(v)},160)};
  $('qx').onclick=function(){Q='';$('q').value='';rerender();$('q').focus()};
  document.addEventListener('keydown',function(e){ if(e.key==='/'&&document.activeElement.tagName!=='INPUT'&&VIEW==='board'){e.preventDefault();$('q').focus()} if(e.key==='Escape')toggleMenu(false) });
  $('clear').onclick=function(){setF(null);Q='';$('q').value='';rerender()};
  $('mbtn').onclick=function(e){e.stopPropagation();toggleMenu()};
  document.addEventListener('click',function(e){ if(menuOpen&&!e.target.closest('.menu'))toggleMenu(false) });
  [].forEach.call($('lang').children,function(b){b.onclick=function(){L=b.dataset.l; ls('bl_lang',L);
    [].forEach.call($('lang').children,function(o){o.setAttribute('aria-pressed',String(o===b))}); render()}});
  [].forEach.call($('theme').children,function(b){b.onclick=function(){var th=b.dataset.t; document.documentElement.dataset.theme=th; ls('bl_theme',th);
    [].forEach.call($('theme').children,function(o){o.setAttribute('aria-pressed',String(o===b))})}});
  var sl=ls('bl_lang'); if(sl&&T[sl]){L=sl;[].forEach.call($('lang').children,function(o){o.setAttribute('aria-pressed',String(o.dataset.l===sl))})}
  var st=ls('bl_theme'); if(st){document.documentElement.dataset.theme=st;[].forEach.call($('theme').children,function(o){o.setAttribute('aria-pressed',String(o.dataset.t===st))})}

  /* ---------- API para assist.js (compartilhar + assistente) ---------- */
  window.BL={
    L:function(){return L}, view:function(){return VIEW}, me:function(){return me},
    go:function(v){VIEW=v;render();window.scrollTo({top:0})},
    filter:function(p,q){setF(p||null);Q=q||'';$('q').value=Q;VIEW='board';dim=(p&&Object.keys(p)[0])||dim;rerender();window.scrollTo({top:0})},
    shown:function(){return all().filter(match)},
    active:function(){var f=[];DIMS.forEach(function(d){if(F[d].length)f.push(dimName(d)+': '+F[d].map(function(v){return label(d,v)}).join(', '))});if(Q)f.push('“'+Q+'”');return f},
    oname:oname, label:label, esc:esc, tx:tx, ls:ls, u:u, render:render, toast:toast
  };

  try{var qp=new URLSearchParams(location.search).get('q');if(qp){Q=qp.slice(0,80);$('q').value=Q}}catch(e){}
  render();

  /* ---------- identidade e base, depois do primeiro paint ---------- */
  if(window.claude&&claude.use){
    claude.use('user').then(function(uc){ if(!uc)return; return uc.me().then(function(m){ me=m;
      if(m&&(m.name||m.id)){ $('who').hidden=false; if(m.avatarUrl)$('whoImg').src=m.avatarUrl; $('whoName').textContent=m.name||'—' }
      if(VIEW==='ai')render(); }) }).catch(function(){});
    claude.use('downloads').then(function(d){DL=d||null}).catch(function(){DL=null});
    claude.use('db').then(function(d){ if(!d)return; db=d;
      d.collection('contrib').limit(200).get().then(function(s){ contrib=s.docs.map(function(x){return x.data()}).filter(function(x){return x&&x.o});
        if(VIEW==='status')render() }).catch(function(){});
    }).catch(function(){});
  }
})();
